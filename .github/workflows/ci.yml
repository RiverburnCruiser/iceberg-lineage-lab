name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Spark downloads the Iceberg runtime jar (~47 MB) into ~/.ivy2* on first use.
      - uses: actions/cache@v4
        with:
          path: ~/.ivy2*
          key: ivy-${{ runner.os }}-${{ hashFiles('lab/spark.py', 'requirements.txt') }}

      - run: pip install -r requirements.txt

      - run: pytest -q --durations=5

      - name: Smoke-test the Spark-free demo
        run: python -m lab.show q5
